services:
  - type: web
    name: binance-pay-gateway
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BINANCE_PAY_API_KEY
        sync: false
      - key: BINANCE_PAY_SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
